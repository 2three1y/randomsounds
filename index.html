<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Sounds Library</title><style>body{font:16px system-ui;max-width:60rem;margin:2rem auto;padding:0 1rem}section{margin:1.5rem 0}h2{font-size:1.2rem}button{margin:.25rem;padding:.65rem 1rem;border:1px solid #888;border-radius:.4rem;background:#f7f7f7}button:focus{outline:3px solid #06c;outline-offset:2px}</style></head><body><h1>Random Sounds</h1><p>Accessible procedural Web Audio sound library. Choose a categorized effect.</p><div id="library"></div><p id="status" role="status" aria-live="polite">Ready. Choose a sound.</p><script type="module">import{soundEffects}from'./audiofx.js';const groups={"Screen Reader": [['activate','VoiceOver activate / tap'],['alert','VoiceOver popover / alert chime'],['rotor','VoiceOver rotor turn / scroll click'],['talkbackFocus','TalkBack focus tick / woodblock knock'],['nvdaBoundary','NVDA boundary / edge bump'],['nvdaError','NVDA error buzz'],['jawsMessage','JAWS chirp / message alert']],"UI / System":[['clickin','Clickin ascending login chime'],['clickout','Clickout descending exit thud'],['switchOn','Switch toggle on'],['switchOff','Switch toggle off'],['success','Success confirmation fanfare'],['warning','Warning ping'],['delete','Delete / trash swoosh'],['sheetOpen','Sheet open'],['modalDismiss','Modal dismiss']],"Keyboard switches":[['blueClick','Blue clicky switch'],['brownBump','Brown tactile bump'],['redThud','Red linear soft thud']],"Retro / Chiptune / Sci-Fi":[['laser','Laser zap'],['coin','Coin collect'],['jump','Jump blip'],['warp','Warp speed glide'],['teleport','Teleport shimmer'],['explosion','8-bit explosion / noise burst']],"Procedural":[['thunderstorm','Thunderstorm / rolling brown-noise rumble'],['randomSound','Random sound generator (infinite variations)'],['chaos','Chaos synth variation']]};const root=document.querySelector('#library'),status=document.querySelector('#status');for(const [name,sounds] of Object.entries(groups)){const section=document.createElement('section');section.setAttribute('aria-labelledby',name.replaceAll(' ','-'));section.innerHTML=`<h2 id="${name.replaceAll(' ','-')}">${name}</h2>`;for(const [method,label] of sounds){const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-label',`Play ${label}`);b.onclick=()=>{soundEffects[method]();status.textContent=`Played: ${label}`};section.append(b)}root.append(section)}</script></body></html>
